services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: noticeboard
      POSTGRES_PASSWORD: noticeboard_local
      POSTGRES_DB: noticeboard
    volumes:
      - noticeboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noticeboard -d noticeboard"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  noticeboard-data:
